# base_link → camera_link 장착 실측값 (REPORT.md 체크리스트 C, PLAN_ROS.md §2.1)
# base_link = 뒷바퀴 축 중심의 바닥 투영 · x 앞 · y 왼쪽 · z 위 · 각도는 도(°)
# 2026-11-21 실측 (수직·수평 거리). y·yaw 는 측정 안 함 → 중앙·정면 가정. pitch·roll 은 영상에서 추정.
x: 0.0              # 뒷축 중심 → 렌즈 중심, 앞 +  (2026-11-21: 카메라는 뒷축 바로 위로 확인 → 0.56에서 0.0으로 수정)
y: 0.0              # 차 중심선 → 렌즈 중심, 왼쪽 + (중앙 가정)
z: 0.75             # 바닥 → 렌즈 중심
pitch_down_deg: 2.5 # 아래로 숙인 각 +  (아크릴 판이 앞으로 조금 기움. 11/20 영상의 세워진 마커 25개 기준 추정 2.6° ±1° — 매핑 주행으로 재확인)
yaw_deg: 0.0        # 왼쪽 +
roll_deg: 2.0       # 같은 추정에서 -2.1° 관측 → 이 파일 규약(+x 축 회전)으로 +2.0. 잠정값
# 운동 모델 (bicycle kinematic, 기준점 = 뒷축 중심)
wheelbase: 0.56     # 앞축 ↔ 뒷축 (m)
rear_axle_to_front_bumper: 0.78   # 뒷축 중심 → 앞범퍼 (m), 출발 자세 변환용
